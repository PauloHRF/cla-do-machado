<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 1000" preserveAspectRatio="xMidYMid slice">
  <defs>
    <filter id="manchas" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.006 0.004" numOctaves="4" seed="7"/>
      <feColorMatrix values="0 0 0 0 0.45  0 0 0 0 0.28  0 0 0 0 0.10  0 0 0 1.6 -0.55"/>
    </filter>
    <filter id="fibras" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.9 0.35" numOctaves="2" seed="3"/>
      <feColorMatrix values="0 0 0 0 0.35  0 0 0 0 0.22  0 0 0 0 0.08  0 0 0 0.9 -0.32"/>
    </filter>
    <filter id="granulo" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="turbulence" baseFrequency="0.45" numOctaves="2" seed="11"/>
      <feColorMatrix values="0 0 0 0 0.3  0 0 0 0 0.18  0 0 0 0 0.06  0 0 0 0.7 -0.28"/>
    </filter>
    <radialGradient id="borda" cx="50%" cy="50%" r="75%">
      <stop offset="0.55" stop-color="#6b3f14" stop-opacity="0"/>
      <stop offset="0.85" stop-color="#6b3f14" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#3d2008" stop-opacity="0.5"/>
    </radialGradient>
    <linearGradient id="luz" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fff4d6" stop-opacity="0.55"/>
      <stop offset="0.5" stop-color="#fff4d6" stop-opacity="0"/>
      <stop offset="1" stop-color="#b98a45" stop-opacity="0.25"/>
    </linearGradient>
  </defs>
  <rect width="600" height="1000" fill="#ead8b2"/>
  <rect width="600" height="1000" fill="url(#luz)"/>
  <rect width="600" height="1000" filter="url(#manchas)"/>
  <rect width="600" height="1000" filter="url(#fibras)" opacity="0.55"/>
  <rect width="600" height="1000" filter="url(#granulo)" opacity="0.45"/>
  <!-- dobras suaves -->
  <path d="M0 330 Q300 350 600 318" stroke="#7a5424" stroke-opacity="0.12" stroke-width="3" fill="none"/>
  <path d="M0 331 Q300 351 600 319" stroke="#fff4d6" stroke-opacity="0.25" stroke-width="2" fill="none"/>
  <path d="M0 690 Q300 672 600 700" stroke="#7a5424" stroke-opacity="0.1" stroke-width="3" fill="none"/>
  <path d="M0 691 Q300 673 600 701" stroke="#fff4d6" stroke-opacity="0.22" stroke-width="2" fill="none"/>
  <rect width="600" height="1000" fill="url(#borda)"/>
</svg>
