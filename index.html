<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Clã do Machado — Mapa de Phantyr</title>
    <meta name="description" content="Mapa interativo de Phantyr, o cenário de RPG do Clã do Machado: cidades, domínios, deuses, história e pontos de interesse." />
    <meta name="theme-color" content="#3a2412" />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Clã do Machado — Mapa de Phantyr" />
    <meta property="og:description" content="Explore cidades, domínios, deuses e a história de Phantyr no mapa interativo do Clã do Machado." />
    <meta property="og:image" content="/img/logo.webp" />
    <link rel="icon" type="image/x-icon" href="/img/favicon_clan.ico" />
  </head>
  <body>
    <div id="map" role="application" aria-label="Mapa de Phantyr"></div>

    <div id="search">
      <i class="fa-solid fa-magnifying-glass" aria-hidden="true"></i>
      <input id="search-input" type="search" placeholder="Pesquisar cidade ou local…" autocomplete="off" aria-label="Pesquisar" />
      <ul id="search-results" role="listbox" hidden></ul>
    </div>

    <nav id="rail" aria-label="Menu principal">
      <button data-tab="inicio" title="Início" aria-label="Início"><i class="fa-solid fa-bars"></i></button>
      <button data-tab="filtros" title="Filtros" aria-label="Filtros"><i class="fa-solid fa-filter"></i></button>
      <button data-tab="detalhe" title="Detalhes" aria-label="Detalhes" hidden><i class="fa-solid fa-scroll"></i></button>
      <span class="grow"></span>
      <a href="https://discord.gg/cla-do-machado-509826698473111563" target="_blank" rel="noopener" title="Discord" aria-label="Discord">
        <i class="fa-brands fa-discord"></i>
      </a>
    </nav>

    <aside id="panel" class="closed" aria-live="polite">
      <header>
        <img src="/img/logo.webp" alt="Clã do Machado" />
        <button id="panel-close" aria-label="Fechar painel"><i class="fa-solid fa-caret-left"></i></button>
      </header>
      <div id="panel-body"></div>
    </aside>

    <aside id="events" hidden>
      <button class="x" aria-label="Fechar"><i class="fa-solid fa-xmark"></i></button>
      <div id="events-body"></div>
    </aside>

    <div id="modal" hidden>
      <div class="box" role="dialog" aria-modal="true">
        <button class="x" aria-label="Fechar"><i class="fa-solid fa-xmark"></i></button>
        <div id="modal-body" class="prose"></div>
      </div>
    </div>

    <div id="coords" hidden></div>
    <div id="toast" hidden></div>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
